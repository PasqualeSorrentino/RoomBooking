services:
  postgres:
    image: postgres:18
    container_name: roombooking-postgres-compose

    environment:
      POSTGRES_USER: roombooking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: roombooking

    volumes:
      - roombooking-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U roombooking -d roombooking"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: roombooking-api

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__RoomBookingDb: >-
        Host=postgres;
        Port=5432;
        Database=roombooking;
        Username=roombooking;
        Password=${POSTGRES_PASSWORD}

    ports:
      - "5102:8080"

volumes:
  roombooking-postgres-data: